services:
  - type: web
    name: petstore-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/pets
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: petstore-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: petstore-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: petstore-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: petstore-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: petstore-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_SSL_MODE
        value: require
      - key: PORT
        value: "8080"

databases:
  - name: petstore-db
    plan: free
    databaseName: petstore
